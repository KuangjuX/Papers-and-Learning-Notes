<svg style="background-color: white;" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 380">
  <style><![CDATA[
    /* Diagram color definitions for Transformer Engine documentation */

/* High precision (BF16/FP16) elements */
.hp {
  fill: #ede7f6;
  stroke: #673ab7;
  stroke-width: 2;
}

/* FP8 precision elements */
.fp8 {
  fill: #fff8e1;
  stroke: #ffa726;
  stroke-width: 2;
}

/* GEMM/computation operations */
.gemm {
  fill: #ffe0b2;
  stroke: #fb8c00;
  stroke-width: 2.5;
}

/* Quantization operations */
.quantize {
  fill: #e8f5e9;
  stroke: #66bb6a;
  stroke-width: 2;
}

/* Amax computation operations */
.amax {
  fill: #e1f5fe;
  stroke: #039be5;
  stroke-width: 2;
}

/* Text styles */
.text {
  font-family: 'Segoe UI', Arial, sans-serif;
  font-size: 14px;
  text-anchor: middle;
  fill: #212121;
}

.small-text {
  font-family: 'Segoe UI', Arial, sans-serif;
  font-size: 14px;
  text-anchor: middle;
  fill: #757575;
}

.label {
  font-family: 'Segoe UI', Arial, sans-serif;
  font-size: 14px;
  text-anchor: middle;
  fill: #424242;
}

.title {
  font-family: 'Segoe UI', Arial, sans-serif;
  font-size: 18px;
  font-weight: 600;
  text-anchor: middle;
  fill: #212121;
}

.section-title {
  font-family: 'Segoe UI', Arial, sans-serif;
  font-size: 15px;
  font-weight: 600;
  text-anchor: middle;
  fill: #212121;
}

/* Accent text colors (used together with .text/.small-text/.section-title) */
.accent-blue { fill: #1565c0; }
.accent-red { fill: #c62828; }
.accent-green { fill: #388e3c; }
.accent-orange { fill: #f57c00; }

/* Neutral container panels (master_weights_approaches.svg) */
.panel {
  fill: #f5f5f5;
  stroke: #9e9e9e;
  stroke-width: 1.5;
}

/* Range bracket lines (fp8_scaling_concept.svg) */
.range-bracket {
  stroke: #666;
  stroke-width: 1.5;
  fill: none;
}

/* Arrows */
/* Note: marker-end references #arrowhead marker which must be defined in each SVG's <defs> section */
.arrow {
  stroke: #616161;
  stroke-width: 2;
  fill: none;
  marker-end: url(#arrowhead);
}

/* Additional box and element styles */
.box-blue {
  fill: #e3f2fd;
  stroke: #1976d2;
  stroke-width: 2;
}

.box-orange {
  fill: #fff3e0;
  stroke: #f57c00;
  stroke-width: 2;
}

.box-green {
  fill: #c8e6c9;
  stroke: #388e3c;
  stroke-width: 2;
}

.box-dashed {
  stroke-dasharray: 5,5;
}

/* LayerNorm specific */
.layernorm {
  fill: #b3e5fc;
  stroke: #0277bd;
  stroke-width: 2.5;
}

/* Fused layers */
.fused {
  fill: #b2dfdb;
  stroke: #00695c;
  stroke-width: 3;
}

/* Generic computation blocks */
.computation {
  fill: #f5f5f5;
  stroke: #757575;
  stroke-width: 2;
}

/* FP32 precision (alternative red) */
.fp32 {
  fill: #ffcdd2;
  stroke: #d32f2f;
  stroke-width: 2.5;
}

/* Dark mode overrides: darken fills and lighten text so diagrams stay
   legible against the theme's dark background. */
html[data-theme="dark"] .hp { fill: #3a2f5c; stroke: #b39ddb; }
html[data-theme="dark"] .fp8 { fill: #4d3c00; stroke: #ffca28; }
html[data-theme="dark"] .gemm { fill: #663c00; stroke: #ffb74d; }
html[data-theme="dark"] .quantize { fill: #1b3d1e; stroke: #81c784; }
html[data-theme="dark"] .amax { fill: #0d3c54; stroke: #4fc3f7; }
html[data-theme="dark"] .allgather { fill: #0d3c54; stroke: #4fc3f7; }
html[data-theme="dark"] .box-blue { fill: #10375c; stroke: #64b5f6; }
html[data-theme="dark"] .box-orange { fill: #5c3a10; stroke: #ffb74d; }
html[data-theme="dark"] .box-green { fill: #1e4620; stroke: #81c784; }
html[data-theme="dark"] .layernorm { fill: #10405c; stroke: #4fc3f7; }
html[data-theme="dark"] .fused { fill: #103c38; stroke: #4db6ac; }
html[data-theme="dark"] .computation { fill: #2b2b2b; stroke: #9e9e9e; }
html[data-theme="dark"] .fp32 { fill: #5c1f1f; stroke: #ef9a9a; }

html[data-theme="dark"] .text,
html[data-theme="dark"] .title {
  fill: #f5f5f5;
}

html[data-theme="dark"] .small-text {
  fill: #bdbdbd;
}

html[data-theme="dark"] .label {
  fill: #e0e0e0;
}

html[data-theme="dark"] .arrow {
  stroke: #bdbdbd;
}

/* Text sitting directly on the page background (not inside boxes) */
html[data-theme="dark"] .section-title,
html[data-theme="dark"] .section-label,
html[data-theme="dark"] .column-title,
html[data-theme="dark"] .dots-text,
html[data-theme="dark"] .dots-text-small {
  fill: #e0e0e0;
}

/* Lighter accents; must come after the .text/.small-text overrides */
html[data-theme="dark"] .phase-forward,
html[data-theme="dark"] .accent-blue { fill: #64b5f6; }
html[data-theme="dark"] .phase-backward,
html[data-theme="dark"] .accent-red { fill: #ef9a9a; }
html[data-theme="dark"] .accent-green { fill: #81c784; }
html[data-theme="dark"] .accent-orange { fill: #ffb74d; }

/* Arrowhead markers use fill attributes, which any CSS rule overrides */
html[data-theme="dark"] marker polygon {
  fill: #bdbdbd;
}

/* Container panels and bracket/axis strokes on the page background */
html[data-theme="dark"] .panel { fill: #1f1f1f; stroke: #757575; }
html[data-theme="dark"] .range-bracket { stroke: #bdbdbd; }
html[data-theme="dark"] .arrow-dashed { stroke: #bdbdbd; }
html[data-theme="dark"] .axis-line,
html[data-theme="dark"] .axis,
html[data-theme="dark"] .tick,
html[data-theme="dark"] .bwd-bracket { stroke: #bdbdbd; }

/* Text on the page background in bit-layout / axis diagrams */
html[data-theme="dark"] .format-label,
html[data-theme="dark"] .value-text,
html[data-theme="dark"] .tick-label { fill: #f5f5f5; }
html[data-theme="dark"] .header-text,
html[data-theme="dark"] .range-label,
html[data-theme="dark"] .sub-label { fill: #bdbdbd; }
html[data-theme="dark"] .param-label,
html[data-theme="dark"] .bracket-label { fill: #e0e0e0; }

/* Flow-diagram box classes (mxfp8/blockwise swizzle-flow diagrams) */
html[data-theme="dark"] .input-box,
html[data-theme="dark"] .quantize-box { fill: #3a2f5c; stroke: #b39ddb; }
html[data-theme="dark"] .quantize-fused-box { fill: #4a3a70; stroke: #b39ddb; }
html[data-theme="dark"] .mxfp8-box,
html[data-theme="dark"] .blockwise-box { fill: #10375c; stroke: #64b5f6; }
html[data-theme="dark"] .fp8-tile { fill: #16496f; stroke: #64b5f6; }
html[data-theme="dark"] .scale-tile,
html[data-theme="dark"] .gemm-box { fill: #1e4620; stroke: #81c784; }
html[data-theme="dark"] .scale-swizzled,
html[data-theme="dark"] .swizzle-box { fill: #5c3a10; stroke: #ffb74d; }
html[data-theme="dark"] .comm-box { fill: #4d3c00; stroke: #ffca28; }

/* rht.svg and nvfp4_all_gather.svg boxes */
html[data-theme="dark"] .input { fill: #10375c; stroke: #64b5f6; }
html[data-theme="dark"] .grad { fill: #5c1f38; stroke: #f48fb1; }
html[data-theme="dark"] .rht { fill: #5c3a10; stroke: #ffb74d; }
html[data-theme="dark"] .output { fill: #1e4620; stroke: #81c784; }
html[data-theme="dark"] .nvfp4 { fill: #10375c; stroke: #64b5f6; }

/* White backing rects behind "..." glyphs: match the page background */
html[data-theme="dark"] .diagram-bg { fill: #121212; }
html[data-theme="dark"] .tensor-outline { stroke: #9e9e9e; }

/* Inter-frame connector segments drawn on the page background */
html[data-theme="dark"] .connector-ext { stroke: #bdbdbd; }

/* Ellipsis glyphs that sit on cells that stay light in dark mode */
html[data-theme="dark"] .on-light-bg { fill: #212121; }

/* cpu_offloading diagrams (classes unique to those four SVGs) */
html[data-theme="dark"] .layer-box { fill: #2b2b2b; stroke: #9e9e9e; }
html[data-theme="dark"] .layer-text { fill: #e0e0e0; }
html[data-theme="dark"] .tensor-box { fill: #10375c; stroke: #64b5f6; }
html[data-theme="dark"] .tensor-text { fill: #90caf9; }
html[data-theme="dark"] .fwd-block { fill: #2e4a63; stroke: #7ba7cc; }
html[data-theme="dark"] .bwd-block { fill: #453a52; stroke: #b39ddb; }
html[data-theme="dark"] .offload-block { fill: #5c3a10; stroke: #d9a066; }
html[data-theme="dark"] .reload-block { fill: #2a4a26; stroke: #81c784; }
html[data-theme="dark"] .model-block { fill: #333333; stroke: #9e9e9e; }
html[data-theme="dark"] .wait-block { fill: #4a1d1d; stroke: #ef9a9a; }
html[data-theme="dark"] .wait-text { fill: #ef9a9a; }
html[data-theme="dark"] .block-text { fill: #e0e0e0; }
html[data-theme="dark"] .cpu-box { fill: #2e4a63; stroke: #7ba7cc; }
html[data-theme="dark"] .gpu-box { fill: #2a4a26; stroke: #81c784; }
html[data-theme="dark"] .frame-box { fill: #1f1f1f; stroke: #616161; }
html[data-theme="dark"] .memory-box { fill: #333c47; stroke: #9e9e9e; }
html[data-theme="dark"] .hbm-box { fill: #1e4620; stroke: #68d391; }
html[data-theme="dark"] .subtitle,
html[data-theme="dark"] .memory-label { fill: #e0e0e0; }
html[data-theme="dark"] .connector { stroke: #bdbdbd; }


/* fine_grained_quantization diagrams */
html[data-theme="dark"] .fmt-mxfp8 { fill: #10375c; stroke: #64b5f6; }
html[data-theme="dark"] .fmt-nvfp4 { fill: #5c3a10; stroke: #ffb74d; }
html[data-theme="dark"] .fmt-bf16 { fill: #1e4620; stroke: #81c784; }
html[data-theme="dark"] .fmt-mxfp8-text { fill: #90caf9; }
html[data-theme="dark"] .fmt-nvfp4-text { fill: #ffcc80; }
html[data-theme="dark"] .fmt-bf16-text { fill: #a5d6a7; }
html[data-theme="dark"] .source { fill: #3a2f5c; stroke: #b39ddb; }
html[data-theme="dark"] .quantizer { fill: #1e4620; stroke: #81c784; }
html[data-theme="dark"] .representation { fill: #10375c; stroke: #64b5f6; }
html[data-theme="dark"] .dequantize { fill: #5c3a10; stroke: #ffb74d; }
html[data-theme="dark"] .rowlabel,
html[data-theme="dark"] .legend,
html[data-theme="dark"] .op { fill: #e0e0e0; }


    .axis-line { stroke: #333; stroke-width: 2.5; }
    .value-dot { fill: #2196f3; stroke: #1976d2; stroke-width: 1; }
    .arrow { fill: #4caf50; }
    .arrow-line { stroke: #4caf50; stroke-width: 3; }
    .range-label { font-size: 14px; fill: #555; font-weight: 500; }
  ]]></style>

  <!-- Top: Original values (before scaling) -->
  <text x="450" y="55" class="section-title" text-anchor="middle">Original Tensor Values</text>

  <!-- Top axis -->
  <line x1="80" y1="85" x2="820" y2="85" class="axis-line"/>

  <!-- Zero marker (center) -->
  <line x1="450" y1="80" x2="450" y2="90" class="axis-line"/>
  <text x="450" y="108" class="text" text-anchor="middle" font-size="12px">0</text>

  <!-- Value dots (before scaling - irregular, not symmetric around zero) -->
  <circle cx="118" cy="85" r="6" fill="#e53935" stroke="#c62828" stroke-width="2"/>
  <circle cx="159" cy="85" r="5" class="value-dot"/>
  <circle cx="167" cy="85" r="5" class="value-dot"/>
  <circle cx="187" cy="85" r="5" class="value-dot"/>
  <circle cx="199" cy="85" r="5" class="value-dot"/>
  <circle cx="228" cy="85" r="5" class="value-dot"/>
  <circle cx="326" cy="85" r="5" class="value-dot"/>
  <circle cx="368" cy="85" r="5" class="value-dot"/>
  <circle cx="442" cy="85" r="5" class="value-dot"/>
  <circle cx="621" cy="85" r="5" class="value-dot"/>
  <circle cx="649" cy="85" r="5" class="value-dot"/>
  <circle cx="725" cy="85" r="5" class="value-dot"/>

  <!-- amax label -->
  <text x="118" y="70" class="text accent-red" font-weight="700" font-size="14px" text-anchor="middle">amax</text>

  <!-- Original range bracket spanning all values -->
  <line x1="118" y1="100" x2="118" y2="110" class="range-bracket"/>
  <line x1="118" y1="110" x2="725" y2="110" class="range-bracket"/>
  <line x1="725" y1="100" x2="725" y2="110" class="range-bracket"/>
  <text x="750" y="114" class="range-label" text-anchor="start">Original range</text>

  <!-- Trapezoid showing compression from original range to FP8 range -->
  <polygon points="118,115 725,115 650,165 250,165" fill="#e53935" opacity="0.2" stroke="#e53935" stroke-width="1.5"/>

  <!-- Bottom: After scaling -->
  <text x="450" y="190" class="section-title" text-anchor="middle">Scaled Values (fit FP8 range)</text>

  <!-- Bottom axis -->
  <line x1="80" y1="220" x2="820" y2="220" class="axis-line"/>

  <!-- Zero marker (center) -->
  <line x1="450" y1="215" x2="450" y2="225" class="axis-line"/>
  <text x="450" y="238" class="text" text-anchor="middle" font-size="12px">0</text>

  <!-- FP8 range bracket -->
  <line x1="250" y1="245" x2="250" y2="255" stroke="#4caf50" stroke-width="1.5"/>
  <line x1="250" y1="255" x2="650" y2="255" stroke="#4caf50" stroke-width="1.5"/>
  <line x1="650" y1="245" x2="650" y2="255" stroke="#4caf50" stroke-width="1.5"/>
  <text x="750" y="259" class="range-label accent-green" text-anchor="start">FP8 range</text>

  <!-- Value dots (after scaling - homogeneous scaling from zero, all fit into FP8 range) -->
  <circle cx="250" cy="220" r="6" fill="#e53935" stroke="#c62828" stroke-width="2"/>
  <text x="250" y="205" class="text accent-red" font-weight="700" font-size="12px" text-anchor="middle">- FP8 range max</text>
  <circle cx="275" cy="220" r="5" class="value-dot"/>
  <circle cx="280" cy="220" r="5" class="value-dot"/>
  <circle cx="292" cy="220" r="5" class="value-dot"/>
  <circle cx="299" cy="220" r="5" class="value-dot"/>
  <circle cx="316" cy="220" r="5" class="value-dot"/>
  <circle cx="375" cy="220" r="5" class="value-dot"/>
  <circle cx="401" cy="220" r="5" class="value-dot"/>
  <circle cx="445" cy="220" r="5" class="value-dot"/>
  <circle cx="553" cy="220" r="5" class="value-dot"/>
  <circle cx="569" cy="220" r="5" class="value-dot"/>
  <circle cx="615" cy="220" r="5" class="value-dot"/>

  <!-- Third line: After cast to FP8 (quantized values) -->
  <text x="450" y="290" class="section-title" text-anchor="middle">Cast to FP8 (quantized values)</text>

  <!-- Third axis -->
  <line x1="80" y1="320" x2="820" y2="320" class="axis-line"/>

  <!-- Zero marker (center) -->
  <line x1="450" y1="315" x2="450" y2="325" class="axis-line"/>
  <text x="450" y="338" class="text" text-anchor="middle" font-size="12px">0</text>

  <!-- FP8 range bracket -->
  <line x1="250" y1="345" x2="250" y2="355" stroke="#4caf50" stroke-width="1.5"/>
  <line x1="250" y1="355" x2="650" y2="355" stroke="#4caf50" stroke-width="1.5"/>
  <line x1="650" y1="345" x2="650" y2="355" stroke="#4caf50" stroke-width="1.5"/>
  <text x="750" y="359" class="range-label accent-green" text-anchor="start">FP8 range</text>

  <!-- Quantized dots - merged close values to show FP8 granularity -->
  <circle cx="250" cy="320" r="6" fill="#e53935" stroke="#c62828" stroke-width="2"/>
  <!-- merged: 275+280 -->
  <circle cx="278" cy="317" r="4.5" class="value-dot"/>
  <circle cx="278" cy="323" r="4.5" class="value-dot"/>
  <!-- merged: 292+299 -->
  <circle cx="296" cy="317" r="4.5" class="value-dot"/>
  <circle cx="296" cy="323" r="4.5" class="value-dot"/>
  <circle cx="318" cy="320" r="5" class="value-dot"/>
  <circle cx="378" cy="320" r="5" class="value-dot"/>
  <circle cx="404" cy="320" r="5" class="value-dot"/>
  <circle cx="450" cy="320" r="5" class="value-dot"/>
  <!-- merged: 553+569 -->
  <circle cx="562" cy="317" r="4.5" class="value-dot"/>
  <circle cx="562" cy="323" r="4.5" class="value-dot"/>
  <circle cx="615" cy="320" r="5" class="value-dot"/>

</svg>
