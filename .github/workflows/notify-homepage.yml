# The homepage consumer should read reading/index.md for the paper catalog.
# Keep the existing event type for consumer compatibility.
#
# Prerequisites:
#   Create a GitHub Personal Access Token (classic) with `repo` scope,
#   then add it as a secret named HOMEPAGE_DISPATCH_TOKEN in the Papers-and-Learning-Notes repo:
#     Papers-and-Learning-Notes repo → Settings → Secrets → Actions → New repository secret

name: Notify Homepage

on:
  push:
    branches: [main]
    paths:
      - "reading/index.md"

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger homepage sync
        run: |
          curl --fail-with-body --retry 3 -X POST \
            -H "Accept: application/vnd.github.v3+json" \
            -H "Authorization: token ${{ secrets.HOMEPAGE_DISPATCH_TOKEN }}" \
            https://api.github.com/repos/KuangjuX/KuangjuX.github.io/dispatches \
            -d '{"event_type": "paper-reading-updated"}'
