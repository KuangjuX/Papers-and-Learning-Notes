name: Reading bot tests

on:
  pull_request:
    paths:
      - 'scripts/reading-bot/**'
      - 'scripts/check-paper-notes.mjs'
      - '.vitepress/redirect-page.mjs'
      - '.vitepress/paper-redirects.json'
      - 'Papers/**'
      - '.github/workflows/reading-bot-tests.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/reading-bot/**'
      - 'scripts/check-paper-notes.mjs'
      - '.vitepress/redirect-page.mjs'
      - '.vitepress/paper-redirects.json'
      - 'Papers/**'
      - '.github/workflows/reading-bot-tests.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - run: node --test scripts/reading-bot/*.test.mjs
      - run: node scripts/check-paper-notes.mjs
